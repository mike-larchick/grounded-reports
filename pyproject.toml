[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-reports"
version = "0.1.0"
description = "Grounded LLM report generation with claim validation, retry-with-feedback, and deterministic fallback."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mike Larchick" }]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
grounded-reports = "grounded_reports.cli:main"

[tool.setuptools.packages.find]
include = ["grounded_reports*"]
